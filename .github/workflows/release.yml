name: Release ServerWatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versi rilis (contoh: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows (AMD64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS (Nullsoft Scriptable Install System)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisBin = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisBin) {
              echo "$nsisBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          $goBin = "$env:USERPROFILE\go\bin"
          echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tools
        shell: pwsh
        run: |
          go version
          wails version
          makensis /VERSION

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd frontend
          npm ci

      - name: Run Go Test Suite
        shell: pwsh
        run: |
          go test ./...

      - name: Build Application & NSIS Installer
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag }}"
          $version = if ($inputTag) { $inputTag } elseif ($ref -and $ref.StartsWith("v")) { $ref } else { "v1.0.0" }
          
          # Sinkronkan productVersion di wails.json
          $cleanVersion = $version.TrimStart('v')
          if (Test-Path "wails.json") {
              $wJson = Get-Content "wails.json" -Raw | ConvertFrom-Json
              $wJson.info.productVersion = $cleanVersion
              $wJson | ConvertTo-Json -Depth 10 | Set-Content "wails.json" -Encoding UTF8
          }
          
          # Eksekusi skrip build rilis
          ./scripts/build-release.ps1 -Version $version

      - name: Upload Build Artifacts (Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: ServerWatch-Windows-AMD64
          path: |
            build/bin/*Setup.exe
            build/bin/*Portable.zip
            build/bin/SHA256SUMS.txt
            build/bin/CARA_PAKAI.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ServerWatch ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/bin/*Setup.exe
            build/bin/*Portable.zip
            build/bin/SHA256SUMS.txt
            build/bin/CARA_PAKAI.txt
          generate_release_notes: true
          draft: false
          prerelease: false
