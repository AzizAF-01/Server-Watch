name: Release ServerWatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versi rilis (contoh: v1.0.1)'
        required: false
        default: ''

# Cabut semua izin default secara global (Principle of Least Privilege)
permissions: {}

jobs:
  build:
    name: Build & Verify (Windows AMD64)
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version-step.outputs.version }}
    permissions:
      contents: read
      id-token: write        # Diperlukan untuk cryptographic provenance / artifact attestation
      attestations: write    # Diperlukan untuk mencatat tanda tangan integritas biner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS (Nullsoft Scriptable Install System)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisBin = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisBin) {
              echo "$nsisBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          $goBin = "$env:USERPROFILE\go\bin"
          echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tools
        shell: pwsh
        run: |
          go version
          wails version
          makensis /VERSION

      - name: Build Frontend Assets
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Go Test Suite
        shell: pwsh
        run: |
          go test ./...

      - name: Determine Version
        id: version-step
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag }}"
          $ver = if ($inputTag) { $inputTag } elseif ($ref -and $ref.StartsWith("v")) { $ref } else { "v1.0.0" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Application & NSIS Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version-step.outputs.version }}"
          
          # Sinkronkan productVersion di wails.json
          $cleanVersion = $version.TrimStart('v')
          if (Test-Path "wails.json") {
              $wJson = Get-Content "wails.json" -Raw | ConvertFrom-Json
              $wJson.info.productVersion = $cleanVersion
              $wJson | ConvertTo-Json -Depth 10 | Set-Content "wails.json" -Encoding UTF8
          }
          
          # Eksekusi skrip build rilis
          ./scripts/build-release.ps1 -Version $version

      - name: Generate Artifact Attestation (Cryptographic Provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/bin/*Setup.exe
            build/bin/*Portable.zip

      - name: Upload Build Artifacts (Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: ServerWatch-Windows-AMD64
          path: |
            build/bin/*Setup.exe
            build/bin/*Portable.zip
            build/bin/SHA256SUMS.txt
            build/bin/CARA_PAKAI.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Manual Approval & Publish Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    # Benteng Pertahanan: Environment release-approval memerlukan review/approval manual
    # dari pemilik repositori di antarmuka GitHub sebelum file dipublikasikan.
    environment: release-approval
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ServerWatch-Windows-AMD64
          path: release-artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_version }}
          name: ServerWatch ${{ needs.build.outputs.release_version }}
          files: |
            release-artifacts/*Setup.exe
            release-artifacts/*Portable.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/CARA_PAKAI.txt
          generate_release_notes: true
          draft: false
          prerelease: false
