name: CI Test & Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Hanya izin baca kode (aman dari pencurian rahasia/release injection)
permissions:
  contents: read

jobs:
  test:
    name: Run Go Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Go Test Suite
        run: |
          go test ./...
